<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Space Miner 4000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#050505;color:#f2f2f2;font-family:'VT323',monospace;overflow:hidden}
  *{box-sizing:border-box}
  #wrap{position:fixed;inset:0;display:grid;place-items:center;background:#050505}
  canvas{width:100vw;height:100vh;display:block;touch-action:none}
  /* CRT: scanlines + vignette (press C to toggle) */
  #crt{position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.26) 3px,rgba(0,0,0,0) 4px);
    box-shadow:inset 0 0 14vmin 4vmin rgba(0,0,0,.85)}
  #crt.off{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="crt"></div>
<script>
'use strict';

const VERSION='v1.9.78';
const c = document.getElementById('game');
const ctx = c.getContext('2d');
const crtEl=document.getElementById('crt');

/* ---------------------------------------------------------------- AUDIO */
let audioCtx=null, thrustNode=null, noiseBuf=null, workshopNode=null;
function setWorkshopSound(on){
  if(!audioCtx)return;
  if(on){
    if(workshopNode)return;
    const src=audioCtx.createBufferSource();src.buffer=getNoise();src.loop=true;
    const filter=audioCtx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=520;filter.Q.value=.7;
    const gain=audioCtx.createGain();gain.gain.value=.018;
    src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);src.start();
    const osc=audioCtx.createOscillator(),drillFilter=audioCtx.createBiquadFilter(),drillGain=audioCtx.createGain();
    osc.type='sawtooth';osc.frequency.value=95;
    drillFilter.type='lowpass';drillFilter.frequency.value=280;
    drillGain.gain.value=.008;
    osc.connect(drillFilter);drillFilter.connect(drillGain);drillGain.connect(audioCtx.destination);osc.start();
    workshopNode={src,gain,osc,drillGain};
  }else if(workshopNode){
    const w=workshopNode;workshopNode=null;
    const now=audioCtx.currentTime;
    w.gain.gain.setTargetAtTime(0,now,.06);w.drillGain.gain.setTargetAtTime(0,now,.06);
    w.src.stop(now+.3);w.osc.stop(now+.3);
  }
}
function workshopHammer(){
  if(!audioCtx)return;
  noise(.055,.025,1800);beep(170,.045,'square',.012,-35);
}
function initAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC) audioCtx=new AC();
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
}
function getNoise(){
  if(!noiseBuf){
    const n=audioCtx.sampleRate;noiseBuf=audioCtx.createBuffer(1,n,n);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }
  return noiseBuf;
}
function beep(freq=440,dur=.08,type='square',vol=.05,slide=0,delay=0){
  if(!audioCtx)return;
  const now=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,now);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide),now+dur);
  g.gain.setValueAtTime(vol,now);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+dur+.02);
}
// Arcade-style filtered noise burst for explosions.
function noise(dur=.3,vol=.12,freq=1200){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const src=audioCtx.createBufferSource();src.buffer=getNoise();
  const f=audioCtx.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(freq,now);f.frequency.exponentialRampToValueAtTime(60,now+dur);
  const g=audioCtx.createGain();g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  src.connect(f);f.connect(g);g.connect(audioCtx.destination);
  src.start(now,Math.random()*.5);src.stop(now+dur+.02);
}
function sfx(name){
  if(name==='sizzle'){initAudio();noise(.7,.13,4200);return;}
  if(name==='chomp'){initAudio();beep(160,.06,'square',.06,-90);beep(120,.08,'square',.05,-60,.07);noise(.12,.08,1800);return;}
  initAudio();
  if(!audioCtx)return;
  if(name==='shoot') beep(880,.06,'square',.03,-500);
  else if(name==='hit'){noise(.25,.14,900);beep(105,.11,'sawtooth',.06,-55)}
  else if(name==='pop') noise(.16,.07,2400);
  else if(name==='boom'){noise(.9,.25,1400);beep(70,.5,'sawtooth',.07,-40)}
  else if(name==='alien') beep(240,.07,'square',.025,120);
  else if(name==='gem'){beep(1046,.05,'square',.03);beep(1568,.08,'square',.03,0,.05)}
  else if(name==='fuel'){beep(180,.07,'sine',.045,120);beep(300,.08,'sine',.035,100,.05)}
  else if(name==='crack') beep(320,.05,'square',.03,-120);
  else if(name==='buzz') beep(90,.15,'square',.05,-20);
  else if(name==='alarm') beep(880,.06,'square',.022);
  else if(name==='warn'){for(let i=0;i<3;i++){beep(660,.12,'square',.03,0,i*.28);beep(440,.12,'square',.03,0,i*.28+.14)}}
  else if(name==='land'){[392,523,659,784].forEach((f,i)=>beep(f,.14,'square',.035,0,i*.09))}
  else if(name==='jingle'){[523,659,784,1046,784,1046].forEach((f,i)=>beep(f,.09,'square',.03,0,i*.08))}
  else if(name==='extra'){for(let i=0;i<8;i++)beep(i%2?1318:1046,.06,'square',.03,0,i*.06)}
  else if(name==='beat0') beep(58,.1,'square',.07);
  else if(name==='beat1') beep(52,.1,'square',.07);
}
function setThrustSound(on){
  if(!audioCtx) return;
  if(!thrustNode){
    const src=audioCtx.createBufferSource();src.buffer=getNoise();src.loop=true;
    const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
    const g=audioCtx.createGain();g.gain.value=0;
    src.connect(f);f.connect(g);g.connect(audioCtx.destination);src.start();
    thrustNode={g,f,on:false};
  }
  if(thrustNode.on===on) return;
  thrustNode.on=on;
  thrustNode.f.frequency.setTargetAtTime(state==='lander'?300:420,audioCtx.currentTime,.05);
  thrustNode.g.gain.setTargetAtTime(on?.09:0,audioCtx.currentTime,.04);
}

/* --------------------------------------------------------------- CANVAS */
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
// Low-res copies of the frame, added back on top = cheap phosphor bloom.
const glow1=document.createElement('canvas'),g1=glow1.getContext('2d');
const glow2=document.createElement('canvas'),g2=glow2.getContext('2d');
function resize(){
  W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
  c.width=W*DPR;c.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  glow1.width=Math.ceil(W/3);glow1.height=Math.ceil(H/3);
  glow2.width=Math.ceil(W/9);glow2.height=Math.ceil(H/9);
}
addEventListener('resize',resize); resize();

/* -------------------------------------------------------------- HELPERS */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const FONT_BODY='"VT323","Courier New",monospace', FONT_ARC='"Press Start 2P","Courier New",monospace';
function line(x1,y1,x2,y2,w=2){ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function text(t,x,y,s=18,align='left'){ctx.font=Math.round(s*1.35)+'px '+FONT_BODY;ctx.textAlign=align;ctx.fillText(t,x,y)}
// Chunky arcade lettering, shrunk to fit the screen width if needed.
function arc(t,x,y,s=18,align='center',maxW=W*.92){const size=Math.max(8,Math.min(s,maxW/(t.length*1.02)));ctx.font=Math.round(size)+'px '+FONT_ARC;ctx.textAlign=align;ctx.fillText(t,x,y)}
function mono(alpha=1){ctx.strokeStyle='rgba(245,245,245,'+alpha+')';ctx.fillStyle='rgba(245,245,245,'+alpha+')'}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function store(k,v){try{if(v===undefined)return +(localStorage.getItem(k)||0);localStorage.setItem(k,v)}catch(e){return 0}}
const pad6=n=>String(Math.max(0,n|0)).padStart(6,'0');

/* ---------------------------------------------------------------- DATA */
const planets=[
 {name:'ASH MOON', tint:'#bfbfbf', aliens:5, gems:4, fuel:3},
 {name:'BLUE DUST', tint:'#9bc7ff', aliens:7, gems:5, fuel:3},
 {name:'GREEN ROCK', tint:'#a8ddb0', aliens:9, gems:6, fuel:3},
 {name:'VIOLET IX', tint:'#d0b1ff', aliens:11, gems:7, fuel:2},
 {name:'BIG RED', tint:'#ff5050', aliens:14, gems:8, fuel:2}
];
const ORE='#ffd36b';
const FLY_BASE=1.6;          // autoscroll speed in deep space (px/frame)
const EXTRA_LIFE_EVERY=25000;

function loadTable(){
  try{const t=JSON.parse(localStorage.getItem('SM4000_TABLE')||'null');if(Array.isArray(t)&&t.length)return t}catch(e){}
  return [{n:'GPS',s:20000},{n:'ACE',s:15000},{n:'ZAP',s:10000},{n:'CPU',s:5000},{n:'BOB',s:2500}];
}
let table=loadTable();

let state='title',planetIndex=0,score=0,high=Math.max(store('SM4000_HI'),table[0].s),bestPlanet=store('SM4000_BEST'),gems=0,banked=0;
let lives=4,nextLife=EXTRA_LIFE_EVERY,lifeUpgradeBought=false;
let ship={};
let stars=[],shootingStars=[],asteroids=[],gasRings=[],pickups=[],planet={r:90},bullets=[],ebullets=[],aliens=[],drops=[],particles=[],popups=[];
let cameraX=0, surfaceWidth=2400, msg='', msgT=0, stageTimer=0, deathReason='';
let debris=[], explosionTimer=0, explosionScene='', shake=0, flash=0, hideShip=false;
let takeoffAlt=0,takeoffV=0,takeoffCam=0,cavernHeight=2200,lavaAlt=-400;
let cavernNodes=[],cavernSpikes=[],runSeed=1;
let pads=[],padHalf=62,o2=100;
let landerPeakScale=.35,landerRoughness=18,landerPeakCount=2,landerAsteroidCount=4;
let landerVerticalMode=false, landerWorldHeight=0, landerCameraY=0, landerCaveNodes=[], landerCaveHazards=[], landerCaveAsteroids=[], landerTargetX=0;
let minePlatforms=[], mineHoles=[], mineUfo=null, backpackFuel=100, maxBackpackFuel=100;
let mineOxygen=100, mineOxygenMax=100, minePlatformScroll=0, minePitHit=false, pitFlashT=0;
let mineShipFuel=0, mineShipFuelRequired=3, mineIntroT=0;
let lavaFx=[];
let landerWorms=[], hook=null;
const HOOK_LEN=270, HOOK_SPEED=9, HOOK_REEL=11;
const LAVA_PIT_DEPTH=30, PIT_BANK=6, PIT_FLOOR=18;
let dist=0,tripDist=1,scroll=FLY_BASE,nextRock=0,nextRing=0,section=0,beatT=0,beat=0,ufo=null,saucerBombs=[];
let readyT=0,readyA='',readyB='';
let entry=null,endWin=false;
let crtOn=!store('SM4000_NOCRT');
crtEl.classList.toggle('off',!crtOn);
let titleRocks=[],demoT=0;

/* ---------------------------------------------------------------- INPUT */
const keys={};
const GAME_KEYS=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Enter','KeyW','KeyS'];
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.- ';
let actionPressed=false, upPressed=false, jetpackActive=false, endAt=-1e9, upSel=0, paused=false, shieldCharges=0, shieldT=0;
let cheatsEnabled=false, cheatSequence='', cheatSequenceAt=0;
function canRestart(){return performance.now()-endAt>700}
function isMenu(){return ['title','info','gameover','win','upgrade','initials'].includes(state)}

// One handler for keyboard and touch buttons on all menu screens.
function menuKey(code){
  if(state==='initials'){
    const L=LETTERS.length;
    if(code==='ArrowUp') entry.l[entry.i]=(entry.l[entry.i]+1)%L;
    else if(code==='ArrowDown') entry.l[entry.i]=(entry.l[entry.i]+L-1)%L;
    else if(code==='ArrowLeft') entry.i=Math.max(0,entry.i-1);
    else if(code==='ArrowRight'||code==='Space'||code==='Enter'){
      entry.i++;
      if(entry.i>2){
        const n=entry.l.map(k=>LETTERS[k]).join('');
        table.push({n,s:score});table.sort((a,b)=>b.s-a.s);table=table.slice(0,5);
        try{localStorage.setItem('SM4000_TABLE',JSON.stringify(table))}catch(e){}
        state=endWin?'win':'gameover';endAt=performance.now();sfx('land');
        return;
      }
    }
    sfx('crack');
    return;
  }
  if(state==='info'){
    if(code==='Enter'||code==='Escape'||code==='Space'||code==='Backspace'){state='title';sfx('crack');}
    return;
  }
  if(state==='title'){
    if(code==='Enter'){state='info';sfx('land');return;}
    if(canRestart()) resetRun();
    return;
  }
  if(state==='gameover'||state==='win'){
    if(canRestart()) resetRun();
    return;
  }
  if(state==='upgrade'){
    const n=upgradeLayout().rows.length;
    if(code==='ArrowUp') upSel=(upSel+n-1)%n;
    if(code==='ArrowDown') upSel=(upSel+1)%n;
    if(code==='Space') buy(upgradeLayout().rows[upSel].type);
    if(code==='Enter') setupTakeoff();
  }
}


function activateTestShortcut(code){
  if(!cheatsEnabled||isMenu()||state==='exploding')return false;
  const sectionMap={'Digit1':'flight','Digit2':'lander','Digit3':'surface','Digit4':'takeoff'};
  const target=sectionMap[code];
  if(target){
    const currentMatches=(target==='flight'&&state==='flight')||(target==='lander'&&state==='lander')||(target==='surface'&&state==='surface')||(target==='takeoff'&&state==='takeoff');
    if(currentMatches){
      if(planetIndex>=planets.length-1){msg='FINAL PLANET REACHED';msgT=75;sfx('buzz');return true;}
      planetIndex++;
    }
    paused=false;readyT=0;actionPressed=false;upPressed=false;jetpackActive=false;
    if(target==='flight')setupFlight();
    else if(target==='lander')setupLander();
    else if(target==='surface')setupSurface();
    else setupTakeoff();
    msg='TEST SHORTCUT — PLANET '+(planetIndex+1);msgT=90;
    return true;
  }
  return false;
}

addEventListener('keydown',e=>{
  initAudio();
  if(GAME_KEYS.includes(e.code)) e.preventDefault();
  // Unlock all testing cheats by typing BEAR quickly during Planet 1's asteroid flight.
  if(!e.repeat&&state==='flight'&&planetIndex===0&&!cheatsEnabled&&/^[a-z]$/i.test(e.key)){
    const now=performance.now();
    if(now-cheatSequenceAt>2200)cheatSequence='';
    cheatSequenceAt=now;
    cheatSequence=(cheatSequence+e.key.toUpperCase()).slice(-4);
    if(cheatSequence==='BEAR'){
      cheatsEnabled=true;cheatSequence='';msg='CHEATS ENABLED';msgT=110;flash=.35;sfx('extra');
      return;
    }
  }
  if(!e.repeat&&activateTestShortcut(e.code))return;
  if(e.code==='KeyC'&&!e.repeat){crtOn=!crtOn;crtEl.classList.toggle('off',!crtOn);store('SM4000_NOCRT',crtOn?0:1);return}
  if(e.code==='ArrowDown'&&!e.repeat&&!isMenu()&&state!=='exploding'){
    if(shieldCharges>0&&shieldT<=0){shieldCharges--;shieldT=180;sfx('gem');msg='SHIELD ACTIVE — 3 SECONDS';msgT=70;}
    else if(shieldT<=0){sfx('buzz');}
    return;
  }
  if(e.code==='KeyP'&&!e.repeat&&!isMenu()&&state!=='exploding'){
    paused=!paused;
    if(paused)setThrustSound(false);
    sfx(paused?'buzz':'land');
    return;
  }
  // TEST CHEAT: grant every upgrade, including the cavern grappling hook.
  if(e.code==='KeyU'&&!e.repeat&&cheatsEnabled&&!isMenu()&&state!=='exploding'){
    ship.maxFuel=200;ship.fuel=ship.maxFuel;
    ship.maxHull=3;ship.hull=3;ship.laser=4;ship.thrust=2.4;
    shieldCharges=3;ship.hook=true;
    maxBackpackFuel=100;backpackFuel=100;
    mineOxygenMax=100;mineOxygen=100;o2=100;
    banked=99;lives=Math.max(lives,5);lifeUpgradeBought=true;
    msg='CHEAT: ALL UPGRADES + GRAPPLING HOOK';msgT=110;flash=.35;sfx('extra');
    return;
  }
  if(isMenu()){ if(!e.repeat) menuKey(e.code); return; }
  keys[e.code]=true;
  if(e.code==='Space') actionPressed=true;
  if(e.code==='ArrowUp') upPressed=true;
});
addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-k]').forEach(b=>{
  const code=b.dataset.k;
  const on=e=>{e.preventDefault();initAudio();
    if(isMenu()){menuKey(code);return}
    keys[code]=true;if(code==='Space')actionPressed=true;if(code==='ArrowUp')upPressed=true};
  const off=e=>{e.preventDefault();keys[code]=false};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
});

/* ---------------------------------------------------------------- RUN */
function resetRun(){
  planetIndex=0;score=0;gems=0;banked=0;upSel=0;lives=4;nextLife=EXTRA_LIFE_EVERY;lifeUpgradeBought=false;shieldCharges=1;shieldT=0;hook=null;
  cheatsEnabled=false;cheatSequence='';cheatSequenceAt=0;
  runSeed=(Math.random()*1e9)|0;
  ship={fuel:61.4,maxFuel:100,hull:3,maxHull:3,laser:1,thrust:1,x:W*.22,y:H*.5,vx:0,vy:0,angle:0,av:0,grounded:false,inv:0,face:1};
  setupFlight();
}

function ready(a,b){readyT=105;readyA=a;readyB=b;sfx('jingle')}

function addScore(n,x,y,world=false){
  score+=n;
  if(x!==undefined) popups.push({x,y,t:55,txt:String(n),world});
  if(score>=nextLife){lives++;nextLife+=EXTRA_LIFE_EVERY;sfx('extra');msg='EXTRA SHIP!';msgT=100;flash=.6}
}

/* ---------------------------------------------------------------- SETUP */
function makeAsteroid(x,y,ore=false,big=false){
  const r=big?rnd(20,34):rnd(13,30);
  return {x,y,r,vx:rnd(-.9,.15),vy:rnd(-.45,.45),rot:rnd(0,Math.PI*2),spin:rnd(-.035,.035),
          mass:r*r,shape:Array.from({length:9},()=>rnd(.72,1.18)),ore};
}
function initStars(){
  // Three parallax layers: far / mid / near.
  stars=[];
  [[60,.15,.8],[45,.4,1.4],[25,.9,2.2]].forEach(([n,d,s])=>{for(let i=0;i<n;i++)stars.push({x:rnd(0,W),y:rnd(0,H),d,s})});
}

function setupFlight(respawn=false){
  state='flight'; stageTimer=0; bullets=[];ebullets=[];aliens=[];drops=[];particles=[];ufo=null;saucerBombs=[];
  ship.x=W*.2;ship.y=H*.55;ship.vx=0;ship.vy=0;ship.angle=Math.PI/2;ship.av=0;
  const p=planets[planetIndex];
  if(!respawn){
    // Long, arcade-style trip: ~85 s at cruising speed, quicker if you push ahead.
    dist=0;tripDist=FLY_BASE*60*(85+planetIndex*8);
    asteroids=[];gasRings=[];pickups=[];nextRock=150;nextRing=600;section=0;beatT=60;
    planet={r:70+planetIndex*14};
    initStars();
  } else {
    asteroids=asteroids.filter(a=>a.x>W*.8);
  }
  ready('PLANET '+(planetIndex+1),'DEEP SPACE  >>  '+p.name);
}

function setupLander(){
  state='lander';stageTimer=0;bullets=[];ebullets=[];drops=[];particles=[];pickups=[];ufo=null;
  ship.x=W*.5;ship.y=110;
  ship.vx=rnd(-.18,.18);ship.vy=.03;ship.angle=rnd(-.06,.06);ship.av=0;

  // Planet 1 keeps the classic horizontal lander. Later planets use a vertical cavern descent.
  if(planetIndex>=1){setupVerticalLander();ready(planets[planetIndex].name,'CAVERN DESCENT  •  BEWARE SPACE WORMS');return;}
  landerVerticalMode=false;

  // Each planet gets a distinct, progressively harder landing landscape.
  const difficulty=planetIndex;
  padHalf=Math.max(46,62-difficulty*3);
  let px=rnd(W*.2,W*.8);
  if(Math.abs(px-W*.5)<W*.15) px+=W*.15*(px<W*.5?-1:1);
  px=clamp(px,padHalf+24,W-padHalf-24);
  pads=[{x:px,half:padHalf,mult:1}];
  const bh=Math.max(22,padHalf*.58);
  let bx=px<W/2?rnd(W*.68,W*.9):rnd(W*.1,W*.32);
  bx=clamp(bx,bh+16,W-bh-16);
  if(Math.abs(bx-px)>padHalf+bh+50) pads.push({x:bx,half:bh,mult:3,gemTaken:false});

  // Terrain peaks rise with each planet: low on Planet 1, medium on Planet 2,
  // high on Planet 3, then increasingly tall and tighter on later worlds.
  landerPeakScale=.35+difficulty*.34;
  landerRoughness=18+difficulty*9;
  landerPeakCount=2+difficulty;
  landerAsteroidCount=4+difficulty*2;

  asteroids=Array.from({length:landerAsteroidCount},(_,i)=>{
    const r=rnd(8,15+Math.min(7,difficulty*1.5));
    const fromLeft=i%2===0;
    return {
      x:fromLeft?rnd(-80,-20):rnd(W+20,W+80),y:rnd(H*.22,H*.62),r,
      vx:fromLeft?rnd(.32,.65):rnd(-.65,-.32),vy:rnd(-.035,.035),
      rot:rnd(0,Math.PI*2),spin:rnd(-.028,.028),mass:r*r,
      shape:Array.from({length:8},()=>rnd(.76,1.16))
    };
  });
  ready(planets[planetIndex].name,'LUNAR DESCENT');
}

const CAVERN_MOUNTAIN_PROFILE=[

function cavernMountainHeightAt(x){
  const nx=clamp(x/Math.max(1,W),0,1);
  let height=0;
  for(let i=0;i<CAVERN_MOUNTAIN_PROFILE.length-1;i++){
    const a=CAVERN_MOUNTAIN_PROFILE[i],b=CAVERN_MOUNTAIN_PROFILE[i+1];
    if(nx>=a[0]&&nx<=b[0]){
      const t=(nx-a[0])/(b[0]-a[0]);

  for(const pad of pads){

    if(Math.abs(x-pad.x)<=shelfHalf)height=Math.min(height,H*.01);
  }

}

function wormBase(w){const b=verticalCaveBounds(w.y);return {x:w.side==='left'?b.left:b.right,dir:w.side==='left'?1:-1,reach:Math.min(w.len,(b.right-b.left)*.46)};}

// Grappling hook: SPACE fires a claw at the nearest worm burrow. If it reaches a worm

function updateHook(){

function verticalCaveBounds(y){
  const nodes=landerCaveNodes;
  let lo=nodes[0],hi=nodes[nodes.length-1];
  for(let i=0;i<nodes.length-1;i++){if(y>=nodes[i].y&&y<=nodes[i+1].y){lo=nodes[i];hi=nodes[i+1];break;}}
  const t=clamp((y-lo.y)/Math.max(1,hi.y-lo.y),0,1),sm=t*t*(3-2*t);
  const cx=lo.cx+(hi.cx-lo.cx)*sm,half=lo.half+(hi.half-lo.half)*sm;
  return {left:cx-half,right:cx+half};
}
function updateVerticalLander(){

    // and reaches toward the wall without letting its joints disappear behind the cavern edge.
    ctx.strokeStyle='#ff8a24';ctx.fillStyle='#ff8a24';ctx.lineWidth=2.7;ctx.lineCap='round';ctx.lineJoin='round';
    for(let i=0;i<3;i++){
      const along=i-1,step=legSwing*(i===1?-1:1)*.72;
      const attachX=wallDir*5,attachY=along*5+7;
      const knuckleX=wallDir*(6.5+step*.22),knuckleY=along*6+8+step*.55;
      const kneeX=wallDir*(8+step*.25),kneeY=along*7+12-step*.35;
      const footX=edgeX-x;
      const footY=along*9+13+step;
      ctx.beginPath();
      ctx.moveTo(attachX,attachY);
      ctx.lineTo(knuckleX,knuckleY);
      ctx.lineTo(kneeX,kneeY);
      ctx.lineTo(footX,footY);
      ctx.stroke();
      // Small rounded joints give each leg a squid-like, knuckled silhouette.
      ctx.beginPath();ctx.arc(knuckleX,knuckleY,1.8,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(kneeX,kneeY,1.6,0,Math.PI*2);ctx.fill();
    }
    // Smaller hollow body rotated clockwise; legs remain at their original size and positions.
    ctx.save();ctx.rotate(Math.PI/2);ctx.scale(.62,.5);
    ctx.strokeStyle='#ff8a24';ctx.lineWidth=2.5;ctx.beginPath();
    ctx.moveTo(-24,-2);ctx.lineTo(-20,-9);ctx.lineTo(-10,-13);
    ctx.lineTo(2,-15);ctx.lineTo(12,-18);ctx.lineTo(22,-12);
    ctx.lineTo(26,-2);ctx.lineTo(22,10);ctx.lineTo(12,18);
    ctx.lineTo(0,16);ctx.lineTo(-12,20);ctx.lineTo(-22,12);
    ctx.closePath();ctx.stroke();
    // Eyes rotate with the body and use the same orange as its outline.
    ctx.save();ctx.rotate(Math.PI/2);
    ctx.fillStyle='#ff8a24';ctx.fillRect(-6,-10,6,6);ctx.fillRect(-6,6,6,6);
    ctx.restore();
    ctx.restore(); // Body rotation and half-size scale.
    ctx.restore();
  }
  for(const a of landerCaveAsteroids){
    if(a.y<top-50||a.y>bottom+50)continue;
    drawRock({x:a.x,y:a.y-top,r:a.r,rot:a.rot,shape:a.shape},.95,'#d0d0d0');
  }
  // Shared mountain profile: the same outline is used for drawing and collision.
  // Sample it across the screen so the wider, pad-specific flat shelves are drawn accurately.
  const floorTop=landerWorldHeight-72-top;
  ctx.fillStyle='#171719';ctx.strokeStyle=p.tint;ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(0,floorTop+24);

  for(const pd of pads){

    if(pd.mult>1){drawGem(pd.x,py-12,ORE);ctx.fillStyle=ORE;text('x'+pd.mult,pd.x,py+34,13,'center');}

  drawShieldEffect(ship.x,ship.y-top);

  const ang=Math.abs(Math.atan2(Math.sin(ship.angle),Math.cos(ship.angle)));

const GROUND=()=>H*.78;
function terrainY(x){
  const base=GROUND();
  let rough=Math.sin(x*.018+planetIndex)*landerRoughness + Math.sin(x*.051+planetIndex*2)*landerRoughness*.45;
  // Distinct sharp peaks make later planets increasingly demanding, while the pad area stays flat.
  for(let i=0;i<landerPeakCount;i++){
    const centre=(i+1)*W/(landerPeakCount+1)+(planetIndex%2?W*.035:0);
    const width=Math.max(48,W*.07-difficultyWidthOffset());
    const d=Math.abs(x-centre);
    if(d<width){
      const t=1-d/width;
      rough-=landerPeakScale*(H*.34)*(t*t*(3-2*t));
    }
  }
  let k=1;
  for(const p of pads) k=Math.min(k,clamp((Math.abs(x-p.x)-p.half)/110,0,1));
  return base+rough*k;
}
function difficultyWidthOffset(){return Math.min(W*.025,planetIndex*W*.004);}
function padY(){return GROUND()-8}
function surfaceTerrainY(worldX){
  return GROUND() + Math.sin(worldX*.012+planetIndex)*20 + Math.sin(worldX*.028)*10;
}
// Lava pits: steep rock banks dropping to a pool of lava. The solid floor sits
// under the lava, so anyone who walks or falls in sinks into it.
function pitLavaY(h){return Math.max(surfaceTerrainY(h.x),surfaceTerrainY(h.x+h.w))+LAVA_PIT_DEPTH}
function surfaceGroundY(worldX){
  const y=surfaceTerrainY(worldX);
  for(const h of mineHoles){
    if(worldX>h.x && worldX<h.x+h.w){
      const floor=(h.lavaY||pitLavaY(h))+PIT_FLOOR;
      const d=Math.min(worldX-h.x,h.x+h.w-worldX);
      return d>=PIT_BANK?floor:y+(floor-y)*(d/PIT_BANK);
    }
  }
  return y;
}

  const gap=260;

  for(let x=300,i=0;x<surfaceWidth-420;x+=gap,i++){
    const w=130+(i%3)*22;

  });
  // Place gem-bearing ore only in safe ground gaps BETWEEN consecutive pits.

  }

  // Exactly one oxygen tank per mining level, placed beside the third ship-fuel (F) pickup.

function buildCavern(){
  const R=rng(runSeed+planetIndex*977);
  cavernHeight=1800+planetIndex*300;
  cavernNodes=[{a:0,c:.5,w:.27},{a:180,c:.5,w:.25}];
  let a=180,cc=.5;
  while(a<cavernHeight-260){
    a+=125+R()*60;
    cc=clamp(cc+(R()-.5)*.6,.22,.78);
    cavernNodes.push({a,c:cc,w:Math.max(.13,.2-planetIndex*.012)+R()*.07});
  }
  cavernNodes.push({a:cavernHeight-120,c:.5,w:.24});
  cavernNodes.push({a:cavernHeight,c:.5,w:.42});
  cavernSpikes=[];
  for(let i=0,sa=230;sa<cavernHeight-240;i++,sa+=86+R()*30){
    const long=R()<.28+planetIndex*.04;
    cavernSpikes.push({a:sa,side:R()<.5?'left':'right',len:long?52+R()*20:20+R()*18,half:long?20:14});
    if(R()<.15) cavernSpikes.push({a:sa+34,side:R()<.5?'right':'left',len:26+R()*18,half:15});
  }
}
const CAVE_VW=620;
function cavernBounds(alt){
  const a=clamp(alt,0,cavernHeight);
  let lo=cavernNodes[0],hi=cavernNodes[cavernNodes.length-1];
  for(let i=0;i<cavernNodes.length-1;i++){
    if(a>=cavernNodes[i].a && a<=cavernNodes[i+1].a){lo=cavernNodes[i];hi=cavernNodes[i+1];break;}
  }
  const span=Math.max(1,hi.a-lo.a);
  const t=clamp((a-lo.a)/span,0,1);
  const sm=t*t*(3-2*t);
  const half=(lo.w+(hi.w-lo.w)*sm)*CAVE_VW;
  let center=W/2+((lo.c+(hi.c-lo.c)*sm)-.5)*Math.min(W,CAVE_VW);
  center=clamp(center,half,W-half);
  return {left:center-half,right:center+half};
}
function spikeLen(sp,b){return Math.min(sp.len,(b.right-b.left)*.3)}
function cavernCollisionBounds(alt){
  const b=cavernBounds(alt);
  let left=b.left,right=b.right;
  for(const sp of cavernSpikes){
    const d=Math.abs(alt-sp.a);
    if(d<sp.half){
      const inset=spikeLen(sp,cavernBounds(sp.a))*(1-d/sp.half);
      if(sp.side==='left') left+=inset; else right-=inset;
    }
  }
  return {left,right};
}

/* --------------------------------------------------------------- DAMAGE */
function damage(deathText,hitText,boom=true,collision=false){
  // The active 2-second shield blocks every source of hull/suit damage,
  // including direct weapon hits as well as collisions.
  if(shieldT>0) return false;
  if(ship.inv>0) return false;
  ship.hull=Math.max(0,Math.min(3,ship.hull)-1); ship.inv=75; shake=9; flash=.35; sfx('hit');
  if(ship.hull<=0){ lose(deathText,boom); return true; }
  msg=hitText+' — HULL '+ship.hull; msgT=70; return true;
}

function rotatePoint(x,y,a){const c=Math.cos(a),ss=Math.sin(a);return {x:x*c-y*ss,y:x*ss+y*c}}

function spawnShipExplosion(x,y,angle=0){
  const pieces=[
    [0,-18,12,8],[12,8,9,10],[9,10,10,16],[10,16,3,12],
    [3,12,0,15],[0,15,-3,12],[-3,12,-10,16],[-10,16,-9,10],
    [-9,10,-12,8],[-12,8,0,-18],
    [-6,11,-12,22],[-12,22,-16,24],
    [6,11,12,22],[12,22,16,24],[-7,12,7,12]
  ];
  debris=pieces.map(p=>{
    const mx=(p[0]+p[2])/2,my=(p[1]+p[3])/2;
    const rp=rotatePoint(mx,my,angle);
    return {x1:p[0]-mx,y1:p[1]-my,x2:p[2]-mx,y2:p[3]-my,x:x+rp.x,y:y+rp.y,angle:angle+rnd(-.5,.5),
      vx:rnd(-3.2,3.2)+rp.x*.03,vy:rnd(-4.2,-.8)+rp.y*.03,va:rnd(-.22,.22),life:70+rnd(0,25)};
  });
  burst(x,y,40);
}

// Every death goes through a short "exploding" beat, then you lose a ship and respawn.
function lose(reason,shipBoom=false){
  if(state==='exploding') return;
  deathReason=reason||'MISSION LOST';
  explosionScene=state;
  debris=[];
  if(shipBoom && (state==='flight'||state==='lander'||state==='takeoff')) spawnShipExplosion(ship.x,ship.y,ship.angle||0);
  else burst(ship.x,ship.y,30);
  sfx('boom');shake=14;flash=1;
  explosionTimer=100;
  state='exploding';
}
function afterDeath(){
  lives--;
  if(lives<=0){endRun(false);return}
  ship.maxHull=Math.min(3,Math.max(1,ship.maxHull||3));
  ship.hull=Math.min(3,ship.maxHull); ship.fuel=Math.max(ship.fuel,ship.maxFuel*.6); ship.inv=150;
  const sc=explosionScene;
  if(sc==='flight') setupFlight(true);
  else if(sc==='lander') setupLander();
  else if(sc==='takeoff') setupTakeoff();
  else respawnSurface();
  msg=deathReason+' — '+lives+' SHIP'+(lives>1?'S':'')+' LEFT';msgT=150;
}

function burst(x,y,n=12){
  for(let i=0;i<n;i++) particles.push({x,y,vx:rnd(-2.2,2.2),vy:rnd(-2.2,2.2),life:rnd(20,55)});
}
function exhaust(){
  const s=Math.sin(ship.angle),co=Math.cos(ship.angle);
  particles.push({x:ship.x-s*20,y:ship.y+co*20,vx:-s*2+rnd(-.4,.4)+ship.vx*.5,vy:co*2+rnd(-.4,.4),life:rnd(12,22)});
}

function splitAsteroid(a, impactVX=0, impactVY=0){
  if(a.r<15){
    a.dead=true;burst(a.x,a.y,10);
    if(a.ore) pickups.push({x:a.x,y:a.y,vx:-.3,t:0});
    return;
  }
  a.dead=true;
  const nr=a.r*.58;
  for(let i=0;i<2;i++){
    const ang=(i?1:-1)*rnd(.55,1.1);
    const speed=rnd(1.0,2.0);
    asteroids.push({
      x:a.x+Math.cos(ang)*nr,y:a.y+Math.sin(ang)*nr,r:nr,
      vx:a.vx+Math.cos(ang)*speed+impactVX*.15,vy:a.vy+Math.sin(ang)*speed+impactVY*.15,
      rot:rnd(0,Math.PI*2),spin:rnd(-.06,.06),mass:nr*nr,
      shape:Array.from({length:8},()=>rnd(.72,1.18)),ore:a.ore && i===0
    });
  }
  burst(a.x,a.y,16);
}

/* --------------------------------------------------------------- FLIGHT */
// Side-scrolling like Scramble/Defender: the world always moves; pushing right speeds it up.
function updateFlight(){
  stageTimer++;
  const prog=clamp(dist/tripDist,0,1);
  const thrust=.09*ship.thrust, turn=.05;
  if(keys.ArrowLeft) ship.angle-=turn;
  if(keys.ArrowRight) ship.angle+=turn;
  if(keys.ArrowUp && ship.fuel>0){
    ship.vx+=Math.sin(ship.angle)*thrust;
    ship.vy-=Math.cos(ship.angle)*thrust;
    // Once the planet comes into view, let players thrust towards it without spending precious fuel.
    if(tripDist-dist>=W*1.6) ship.fuel-=.03;
    if(stageTimer%2===0) exhaust();
  }
  if(actionPressed && bullets.length<4+ship.laser){
    sfx('shoot');
    const sp=8+ship.laser*.6;
    bullets.push({x:ship.x+Math.sin(ship.angle)*20,y:ship.y-Math.cos(ship.angle)*20,
      vx:ship.vx+Math.sin(ship.angle)*sp,vy:ship.vy-Math.cos(ship.angle)*sp,life:75});
  }

  ship.vx*=.985;ship.vy*=.985;
  ship.vx=clamp(ship.vx,-3,3.2);ship.vy=clamp(ship.vy,-4,4);
  ship.x+=ship.vx;ship.y+=ship.vy;
  ship.y=clamp(ship.y,90,H-25);
  // The ship never hits an invisible wall: past the push line the world scrolls instead.
  const pushLine=W*.5;
  let push=0;
  if(ship.x>pushLine){push=ship.x-pushLine;ship.x=pushLine}
  if(ship.x<30){ship.x=30;if(ship.vx<0)ship.vx=0}
  scroll=FLY_BASE+push;
  dist+=scroll;
  const remaining=tripDist-dist;

  // Sections: open space → asteroid field → dense belt → planet approach.
  const sec=prog<.22?0:prog<.55?1:prog<.85?2:3;
  if(sec!==section){
    section=sec;
    msg=['','ASTEROID FIELD','WARNING — DENSE BELT AHEAD','PLANET APPROACH'][sec];msgT=130;
    if(sec===2) sfx('warn');
  }
  if(remaining>W*1.1){
    nextRock-=scroll;
    if(nextRock<=0){
      // Asteroid fields get denser on every planet. Planet 2+ has more rocks,
      // while Planet 3+ also introduces noticeably larger asteroids.
      const density=Math.max(.58,1-planetIndex*.10);
      const gap=[240,150,95][Math.min(sec,2)]*density;
      const a=makeAsteroid(W+40,rnd(100,H-40),Math.random()<.17,sec===2);
      const sizeScale=planetIndex>=2 ? 1+(planetIndex-1)*.15 : 1+planetIndex*.04;
      a.r*=sizeScale;
      a.mass=a.r*a.r;
      asteroids.push(a);
      nextRock=gap*rnd(.6,1.4);
    }
    nextRing-=scroll;
    if(nextRing<=0){gasRings.push({x:W+40,y:rnd(110,H-80),r:24,vx:rnd(-.2,.2),wobble:rnd(0,6),taken:false});nextRing=rnd(800,1200)}
    if(!ufo && sec>=1 && Math.random()<.0022+planetIndex*.0007) spawnUfo();
  }

  // Asteroids-style heartbeat that speeds up as you close on the planet.
  if(--beatT<=0){beat^=1;sfx(beat?'beat1':'beat0');beatT=Math.round(46-26*prog)}

  for(const b of bullets){b.x+=b.vx;b.y+=b.vy;b.life--}
  bullets=bullets.filter(b=>b.life>0&&b.x>-50&&b.x<W+100&&b.y>-50&&b.y<H+50);

  gasRings.forEach(g=>{
    g.x+=g.vx-scroll;g.wobble+=.025;
    if(!g.taken && Math.hypot(ship.x-g.x,ship.y-g.y)<g.r+15){
      g.taken=true;
      // Planet 1's blue fuel rings give 35% more fuel; later planets keep the standard amount.
      const fuelGain=planetIndex===0?10.125:7.5;
      ship.fuel=Math.min(ship.maxFuel,ship.fuel+fuelGain);
      addScore(25,g.x,g.y);sfx('fuel');msg='+'+(planetIndex===0?'10.125':'7.5')+' FUEL';msgT=45;
    }
  });
  gasRings=gasRings.filter(g=>!g.taken && g.x>-80);

  pickups.forEach(pk=>{
    pk.x+=pk.vx-scroll;pk.t++;
    if(Math.hypot(ship.x-pk.x,ship.y-pk.y)<26){pk.taken=true;gems++;addScore(200,pk.x,pk.y);sfx('gem');msg='+ GEM';msgT=45}
  });
  pickups=pickups.filter(pk=>!pk.taken&&pk.x>-30);

  asteroids.forEach(a=>{a.x+=a.vx-scroll;a.y+=a.vy;a.rot+=a.spin});

  for(let i=0;i<asteroids.length;i++){
    const a=asteroids[i]; if(a.dead)continue;
    for(let j=i+1;j<asteroids.length;j++){
      const b=asteroids[j]; if(b.dead)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;
      if(d>0&&d<min){
        const nx=dx/d,ny=dy/d,overlap=min-d;
        a.x-=nx*overlap*.5;a.y-=ny*overlap*.5;b.x+=nx*overlap*.5;b.y+=ny*overlap*.5;
        const rvx=b.vx-a.vx,rvy=b.vy-a.vy,along=rvx*nx+rvy*ny;
        if(along<0){
          const impulse=-(1.75)*along/(1/a.mass+1/b.mass);
          const ix=impulse*nx,iy=impulse*ny;
          a.vx-=ix/a.mass;a.vy-=iy/a.mass;b.vx+=ix/b.mass;b.vy+=iy/b.mass;
          if(Math.abs(along)>2.25 && (a.r>18||b.r>18)) (a.r>b.r?splitAsteroid(a,rvx,rvy):splitAsteroid(b,-rvx,-rvy));
        }
      }
    }
  }

  for(const b of bullets){
    if(b.life<=0)continue;
    for(const a of asteroids){
      if(a.dead)continue;
      if(Math.hypot(b.x-a.x,b.y-a.y)<a.r+3){
        b.life=0;addScore(a.r>=15?20:50,a.x,a.y);sfx('pop');
        splitAsteroid(a,b.vx,b.vy);
        break;
      }
    }
    if(ufo && b.life>0 && Math.abs(b.x-ufo.x)<24 && Math.abs(b.y-ufo.y)<14){
      b.life=0;ufo.hp--;sfx('pop');burst(ufo.x,ufo.y,8);
      if(ufo.hp<=0){addScore(500,ufo.x,ufo.y);sfx('boom');burst(ufo.x,ufo.y,30);pickups.push({x:ufo.x,y:ufo.y,vx:-.3,t:0});ufo=null;shake=6}
    }
  }

  updateUfo();
  if(state!=='flight')return;

  for(const a of asteroids){
    if(a.dead||state!=='flight')continue;
    if(Math.hypot(ship.x-a.x,ship.y-a.y)<a.r+13){
      const dx=ship.x-a.x,dy=ship.y-a.y,d=Math.hypot(dx,dy)||1;
      ship.vx+=(dx/d)*2.2;ship.vy+=(dy/d)*2.2;
      if(ship.inv===0){
        splitAsteroid(a,ship.vx,ship.vy);burst(ship.x,ship.y,20);
        damage('HULL DESTROYED — ASTEROID IMPACT','ASTEROID HIT',true,true);
      }
    }
  }
  if(state!=='flight')return;
  asteroids=asteroids.filter(a=>!a.dead && a.x>-120 && a.y>-100 && a.y<H+100);
  if(remaining<=0) setupLander();
}

function spawnUfo(){
  ufo={x:W+60,y:rnd(140,H*.6),baseY:0,t:0,hp:2+Math.floor(planetIndex/2),fireT:90};
  ufo.baseY=ufo.y;msg='ALIEN SAUCER!';msgT=70;
}
function updateUfo(){
  if(ufo){
    ufo.t++;
    // Hovers on the right for ~10 s, then bolts off left.
    if(ufo.t<600){const tx=W*.76+Math.sin(ufo.t*.012)*W*.1;ufo.x+=(tx-ufo.x)*.025}
    else ufo.x-=4+scroll;
    ufo.y=ufo.baseY+Math.sin(ufo.t*.045)*60;
    if(ufo.t%22===0) beep(ufo.t%44?700:560,.08,'triangle',.018);
    if(--ufo.fireT<=0 && ufo.x<W){
      const dx=ship.x-ufo.x,dy=ship.y-ufo.y,d=Math.hypot(dx,dy)||1,sp=3.1+planetIndex*.3;
      // Planet 3 onward: saucers keep their original shots AND drop a mine.
      ebullets.push({x:ufo.x,y:ufo.y,vx:dx/d*sp,vy:dy/d*sp,life:440});
      if(planetIndex>=2){
        saucerBombs.push({x:ufo.x,y:ufo.y+12,vx:0,vy:.7,life:240,age:0});
      }
      sfx('alien');
      ufo.fireT=rnd(70,110)-planetIndex*8;
    }
    if(Math.abs(ship.x-ufo.x)<28 && Math.abs(ship.y-ufo.y)<20 && ship.inv===0){
      burst(ship.x,ship.y,20);if(damage('HULL DESTROYED — SAUCER COLLISION','SAUCER HIT',true,true)&&state!=='flight')return;
    }
    if(ufo && ufo.x<-80) ufo=null;
  }
  // Normal saucer bullets remain straight-line aimed shots.
  ebullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;
    if(Math.abs(b.x-ship.x)<11&&Math.abs(b.y-ship.y)<14&&ship.inv===0&&state==='flight'){b.life=0;burst(ship.x,ship.y,14);if(shieldT<=0)damage('HULL DESTROYED — SAUCER FIRE','SAUCER FIRE')}
  });
  ebullets=ebullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);

  // Planets 3–5 use pulsing one-second fuse bombs instead of direct saucer shots.
  saucerBombs.forEach(b=>{
    b.age++;
    // Bombs have a long, gentle homing curve towards the player's current position.
    const dx=ship.x-b.x,dy=ship.y-b.y,d=Math.hypot(dx,dy)||1;
    const speed=1.4+planetIndex*.12;
    const desiredX=dx/d*speed,desiredY=dy/d*speed;
    b.vx+=(desiredX-b.vx)*.035;
    b.vy+=(desiredY-b.vy)*.035;
    b.x+=b.vx-scroll;b.y+=b.vy;
    // A bomb detonates early if it physically touches the ship, or when its
    // one-second fuse expires. The blast can only remove one hull point.
    const shipContact=Math.hypot(ship.x-b.x,ship.y-b.y)<18;
    if(b.age>=120 || shipContact){
      const shipBlastRadius=34;
      const asteroidBlastRadius=408;
      burst(b.x,b.y,28);
      if(Math.hypot(ship.x-b.x,ship.y-b.y)<shipBlastRadius && ship.inv===0 && shieldT<=0){
        damage('HULL DESTROYED — SAUCER BOMB','SAUCER BOMB');
      }
      // Bombs only damage the largest asteroid tier, splitting each hit
      // asteroid down by one size step rather than clearing it completely.
      asteroids.forEach(a=>{
        if(!a.dead && a.r>=15 && Math.hypot(a.x-b.x,a.y-b.y)<asteroidBlastRadius+a.r){
          splitAsteroid(a,b.vx,b.vy);
          addScore(a.ore?250:100,a.x,a.y);
          burst(a.x,a.y,8);
        }
      });
      b.life=0;
    }
  });
  saucerBombs=saucerBombs.filter(b=>b.life>0&&b.x>-60&&b.x<W+60&&b.y>-60&&b.y<H+60);
}

/* --------------------------------------------------------------- ESCAPE */
function updateTakeoff(){
  stageTimer++;
  const launchAlt=28;
  takeoffV-=.0055+planetIndex*.00045;
  const torque=.0016;
  if(keys.ArrowLeft) ship.av-=torque;
  if(keys.ArrowRight) ship.av+=torque;
  ship.av+=-Math.sin(ship.angle)*.00065;
  ship.av*=.989;
  ship.angle+=ship.av;

  if(keys.ArrowUp && ship.fuel>0){
    const power=.0165*ship.thrust;
    ship.vx+=Math.sin(ship.angle)*power;
    takeoffV+=Math.cos(ship.angle)*power;
    ship.fuel-=.035;
    if(stageTimer%2===0) exhaust();
  }
  ship.vx*=.992;takeoffV*=.999;
  ship.x+=ship.vx;takeoffAlt+=takeoffV;
  if(takeoffAlt<launchAlt){takeoffAlt=launchAlt;takeoffV=0;}

  const baseY=H*.82;
  const targetCam=Math.max(0,takeoffAlt-H*.38);
  const prevCam=takeoffCam;
  takeoffCam+=(targetCam-takeoffCam)*.09;
  const dCam=takeoffCam-prevCam;
  particles.forEach(p=>p.y+=dCam);
  ship.y=baseY-(takeoffAlt-takeoffCam);

  const b=cavernCollisionBounds(takeoffAlt);
  const margin=15;
  if(ship.x-margin<b.left || ship.x+margin>b.right){
    const hitLeft=ship.x-margin<b.left;
    const hitRight=ship.x+margin>b.right;
    ship.x=clamp(ship.x,b.left+margin,b.right-margin);
    // Side impacts should barely rebound: just nudge the ship away from the wall.
    ship.vx=hitLeft?Math.max(0,ship.vx*.05):Math.min(0,ship.vx*.05);
    takeoffV*=.99;
    if(ship.inv===0){
      burst(ship.x,ship.y,18);
      if(damage('HULL DESTROYED — CAVERN IMPACT','CAVERN IMPACT',true,true) && state!=='takeoff') return;
    }
  }

  if(stageTimer>45 && takeoffAlt<cavernHeight){
    // Planets 4-5 have much narrower cavern passages, so give the player more time to climb.
    const lavaRate=planetIndex>=4?0.5175:planetIndex===3?0.50:(.72+planetIndex*.11)*1.2;
    lavaAlt+=lavaRate;

    // Keep the lava ominously close to the bottom of the visible cavern.
    // If it falls too far below the screen, gently accelerate it until the gap closes.
    const lavaScreenY=H*.82-(lavaAlt-takeoffCam);
    const targetScreenY=H*.92;
    if(lavaScreenY>targetScreenY){
      const catchup=Math.min(0.9,(lavaScreenY-targetScreenY)*.012);
      lavaAlt+=catchup;
    }
  }
  if(takeoffAlt-24<lavaAlt){lose('CAUGHT BY THE LAVA',true);return}
  if(ship.fuel<=0 && takeoffAlt<cavernHeight*.92 && takeoffV<=0){lose('OUT OF FUEL — TRAPPED IN THE CAVERN');return}

  if(takeoffAlt>=cavernHeight+H*.22){
    addScore(600+Math.max(0,(takeoffAlt-lavaAlt)|0));
    if(planetIndex===planets.length-1){
      // The run is only won after escaping the final planet's rising-lava cavern.
      endRun(true);return;
    } else {
      planetIndex++;
      // Start the next asteroid field with at least half a tank, but never top up fuel above that threshold.
      ship.fuel=Math.max(ship.fuel,ship.maxFuel*.5);
      setupFlight();
    }
  }
}

/* --------------------------------------------------------------- LANDER */
function updateLander(){
  if(landerVerticalMode){updateVerticalLander();return;}
  stageTimer++;
  ship.vy+=.0048 + planetIndex*.00065;
  const torque=.00125;
  if(keys.ArrowLeft) ship.av-=torque;
  if(keys.ArrowRight) ship.av+=torque;
  ship.av+=-Math.sin(ship.angle)*.0009;
  ship.av*=.989;
  ship.angle+=ship.av;

  if(keys.ArrowUp && ship.fuel>0){
    const power=.0145*ship.thrust;
    ship.vx+=Math.sin(ship.angle)*power;
    ship.vy-=Math.cos(ship.angle)*power;
    ship.fuel=Math.max(0,ship.fuel-.028);
    if(stageTimer%3===0) exhaust();
  }
  ship.vx*=.9995;ship.vy*=.9998;
  ship.x+=ship.vx;ship.y+=ship.vy;
  ship.x=clamp(ship.x,22,W-22);
  if(ship.y<90){ship.y=90;ship.vy=Math.max(0,ship.vy)}

  for(const a of asteroids){
    a.x+=a.vx;a.y+=a.vy;a.rot+=a.spin;
    if(a.vx>0 && a.x>W+50){a.x=-50;a.y=rnd(H*.25,H*.58)}
    if(a.vx<0 && a.x<-50){a.x=W+50;a.y=rnd(H*.25,H*.58)}
    if(Math.hypot(ship.x-a.x,ship.y-a.y)<a.r+14){
      const dx=ship.x-a.x,dy=ship.y-a.y,d=Math.hypot(dx,dy)||1;
      ship.vx+=(dx/d)*.42;ship.vy+=(dy/d)*.18;
      if(ship.inv===0){
        a.vx*=-1;a.vy+=rnd(-.04,.04);burst(ship.x,ship.y,14);
        if(damage('HULL DESTROYED — ASTEROID DURING LANDING','ASTEROID CLIP',true,true) && state!=='lander') return;
      }
    }
  }

  // While the 2-second shield is active, gently guide the ship towards the
  // nearest landing pad during descent. This is a soft nudge, not an autopilot.
  if(shieldT>0 && ship.y>H*.3 && pads.length){
    const targetPad=pads.reduce((best,p)=>Math.abs(ship.x-p.x)<Math.abs(ship.x-best.x)?p:best,pads[0]);
    const padDistance=ship.x-targetPad.x;
    if(Math.abs(padDistance)<targetPad.half+150){
      const pull=clamp(-padDistance*.000055,-.008,.008);
      ship.vx+=pull;
      if(Math.abs(padDistance)<targetPad.half+35) ship.vx*=.985;
    }
  }
  const pad=pads.find(p=>Math.abs(ship.x-p.x)<p.half-3);
  const groundY=pad?padY():terrainY(ship.x);
  if(ship.y+22>=groundY){
    const vertical=Math.abs(ship.vy),horizontal=Math.abs(ship.vx);
    const upright=Math.abs(Math.atan2(Math.sin(ship.angle),Math.cos(ship.angle)));
    const safeLanding=vertical<.9 && horizontal<.65 && upright<.30;
    const shieldLanding=!!pad && shieldT>0 && !safeLanding;
    if(pad && (safeLanding || shieldT>0)){
      // An active shield can stabilise a rough touchdown, but only on a landing pad.
      const pts=(shieldLanding?500:500+Math.round((1-vertical/.9)*250))*pad.mult;
      addScore(pts,ship.x,ship.y-40);
      let bonusGem=false;
      if(pad.mult>1 && !pad.gemTaken){pad.gemTaken=true;gems++;addScore(200,ship.x,ship.y-58);sfx('gem');bonusGem=true;}
      sfx('land');shake=3;
      ship.angle=0;ship.av=0;
      setupSurface();
      if(pad.mult>1){msg=bonusGem?'BONUS PAD GEM! +1  •  x'+pad.mult+' PAD':'x'+pad.mult+' BONUS PAD — '+pts+' POINTS';msgT=130}
      else if(shieldLanding){msg='SHIELD-ASSISTED LANDING';msgT=100}
    } else if(!pad) lose('BAD LANDING — CRASHED ON ROUGH GROUND',true);
    else if(vertical>=.9) lose('BAD LANDING — DESCENT TOO FAST',true);
    else if(horizontal>=.65) lose('BAD LANDING — TOO MUCH SIDEWAYS SPEED',true);
    else lose('BAD LANDING — SHIP NOT LEVEL',true);
  }
}

/* -------------------------------------------------------------- SURFACE */
function updateSurface(){
  stageTimer++;
  if(mineIntroT>0){
    mineIntroT--;
    if(mineIntroT===0 && planetIndex!==0){readyT=105;readyA='';readyB='';sfx('jingle');}
  } else if(mineIntroT<0 && (keys.ArrowLeft||keys.ArrowRight||keys.ArrowUp||keys.ArrowDown||keys.Space||keys.Enter||keys.KeyW||keys.KeyS)){
    // On Planet 1, keep the mission guide visible for four seconds after the first control input.
    mineIntroT=240;
  }
  const speed=2.4+ship.thrust*.2;
  const move=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);
  if(move) ship.face=move;
  ship.vx += move*.34; ship.vx *= ship.grounded?.72:.94; ship.vx=clamp(ship.vx,-speed,speed);
  if(upPressed){
    if(ship.grounded){
      // A stronger initial hop makes it easier to reach the first platform.
      ship.vy=-5.8-planetIndex*.07;ship.grounded=false;jetpackActive=false;
      beep(300,.08,'square',.02,200);
    } else {
      jetpackActive=true;
    }
  }
  if(jetpackActive && keys.ArrowUp && backpackFuel>0 && !ship.grounded){
    // Stronger sustained lift, with a modestly slower fuel burn for better control.
    ship.vy-=.46;backpackFuel=Math.max(0,backpackFuel-.38);
    if(backpackFuel<=0)jetpackActive=false;
  } else if(!keys.ArrowUp || !jetpackActive){
    if(backpackFuel<maxBackpackFuel)backpackFuel=Math.min(maxBackpackFuel,backpackFuel+.035);
  }
  ship.vy+=.23+planetIndex*.012; ship.x=clamp(ship.x+ship.vx,30,surfaceWidth-30); ship.y+=ship.vy;
  // Keep the astronaut below the mining saucer; it flies across the upper sky.
  const jetpackCeiling=130;
  if(ship.y<jetpackCeiling){ship.y=jetpackCeiling;if(ship.vy<0)ship.vy=0;}
  const ground=surfaceGroundY(ship.x)-32;
  let platform=null;
  for(const pl of minePlatforms){if(ship.x>pl.x&&ship.x<pl.x+pl.w&&Math.abs((ship.y+32)-pl.y)<28&&ship.vy>=0){platform=pl;break}}
  // Lava pits only hurt if you actually fall in: walking up to the rim, standing
  // on the bank or jumping across is safe. Your boots have to reach the lava.
  const pit=mineHoles.find(h=>ship.x>h.x+PIT_BANK*.5&&ship.x<h.x+h.w-PIT_BANK*.5);
  if(pit && !platform && ship.y+32>=pit.lavaY+3 && !minePitHit){
    minePitHit=true;
    lavaSplash(ship.x,pit.lavaY);
    if(shieldT<=0){
      // Lava ignores ordinary hit-invulnerability: every fall in costs one hull point.
      ship.hull--;ship.inv=75;shake=10;flash=.45;pitFlashT=60;sfx('hit');sfx('sizzle');
      if(ship.hull<=0){lose('FELL INTO A LAVA PIT',false);return;}
      msg='LAVA BURN — HULL '+ship.hull;msgT=70;
    } else {sfx('sizzle');msg='SHIELD SAVED YOU FROM THE LAVA';msgT=70;}
    // Throw the astronaut back out onto the nearest bank.
    const toLeft=ship.x<pit.x+pit.w*.5;
    ship.x=clamp(toLeft?pit.x-26:pit.x+pit.w+26,40,surfaceWidth-40);
    ship.y=surfaceGroundY(ship.x)-34;ship.vy=-3.2;ship.vx=toLeft?-1.2:1.2;ship.grounded=false;jetpackActive=false;
    minePitHit=false;
  } else if(platform){
    ship.y=platform.y-32;ship.vy=0;ship.grounded=true;
  } else if(ship.y>=ground){
    ship.y=ground;ship.vy=0;ship.grounded=true;
  } else ship.grounded=false;
  cameraX=clamp(ship.x-W*.35,0,Math.max(0,surfaceWidth-W));
  updateLavaFx();
  const oxygenDrainMultiplier=planetIndex===0?.70:planetIndex===1?.80:.90;
  mineOxygen=Math.max(0,mineOxygen-.060*oxygenDrainMultiplier); o2=mineOxygen;
  if(mineOxygen<=0){lose('OXYGEN DEPLETED — SUIT BREACHED',true);return;}
  if(mineOxygen<20&&stageTimer%45===0)sfx('alarm');
  if(actionPressed && bullets.filter(b=>!b.enemy).length<4+ship.laser){
    const dir=ship.face;sfx('shoot');bullets.push({x:ship.x+dir*16,y:ship.y+3,vx:dir*(7+ship.laser*.8),vy:0,life:180});
  }
  bullets.forEach(b=>{b.x+=b.vx;b.y+=(b.vy||0);b.life--});
  bullets=bullets.filter(b=>b.life>0&&b.x>cameraX-60&&b.x<cameraX+W+60&&b.y>-80&&b.y<H+160);
  aliens.forEach(a=>{
    a.t++; const pl=a.platform; a.y=pl.y-13;
    // Aliens simply patrol backwards and forwards along their platform.
    const patrolSpeed=.65+planetIndex*.08;
    a.x+=a.dir*patrolSpeed;
    if(a.x<=pl.x+8){a.x=pl.x+8;a.dir=1;}
    if(a.x>=pl.x+pl.w-8){a.x=pl.x+pl.w-8;a.dir=-1;}
    if(Math.abs(a.x-ship.x)<18 && Math.abs(a.y-(ship.y+18))<18 && ship.inv===0){
      ship.vx += (ship.x<a.x?-1:1)*2.5;
      ship.vy=-2.2;
      if(damage('ALIEN IMPACT — SUIT BREACHED','ALIEN HIT',false,true))return;
    }
    if(a.t%(120-planetIndex*10)===0&&Math.abs(a.x-ship.x)<420){sfx('alien');bullets.push({enemy:true,x:a.x,y:a.y-8,vx:(ship.x<a.x?-1:1)*(2.4+planetIndex*.3),vy:0,life:180});}
  });
  if(mineUfo){
    mineUfo.t++; mineUfo.x+=mineUfo.vx;
    if(mineUfo.x<-80){mineUfo.x=W+80;mineUfo.vx=-1.15}
    const saucerFireInterval=planetIndex===0?150:75;
    if(mineUfo.t%saucerFireInterval===0){sfx('shoot');bullets.push({enemy:true,x:mineUfo.x+cameraX,y:mineUfo.y+14,vx:(ship.x-(mineUfo.x+cameraX))*.008,vy:3.2,life:300,ufoShot:true});}
  }
  for(const b of bullets){
    if(b.life<=0)continue;
    if(b.enemy){
      if(Math.abs(b.x-ship.x)<10&&Math.abs(b.y-ship.y)<18&&ship.inv===0){b.life=0;burst(ship.x,ship.y,15);if(damage('SUIT BREACHED — ENEMY FIRE','HIT',false))return;}
    }else{
      let used=false;
      for(const a of aliens){if(a.hp>0&&Math.abs(b.x-a.x)<18&&Math.abs(b.y-a.y)<22){a.hp-=ship.laser;b.life=0;sfx('pop');used=true;if(a.hp<=0){burst(a.x,a.y,12);addScore(250,a.x,a.y-30,true)}break;}}
      if(used)continue;
      for(const d of drops){if(d.type!=='ore'||d.taken)continue;if(Math.abs(b.x-d.x)<18){b.life=0;d.hp-=ship.laser;sfx('crack');const oy=surfaceGroundY(d.x)-12;burst(d.x,oy,6);if(d.hp<=0){d.taken=true;burst(d.x,oy,14);drops.push({type:'gem',x:d.x,y:d.y,taken:false,pop:20})}break;}}
    }
  }
  aliens=aliens.filter(a=>a.hp>0);
  for(const d of drops){
    if(d.taken||d.type==='ship'||d.type==='ore')continue;
    if(d.pop>0)d.pop--;
    if(d.type==='gem'&&d.y===0)d.y=surfaceTerrainY(d.x)-30;
    if(Math.abs(d.x-ship.x)<28&&Math.abs(d.y-ship.y)<45){
      d.taken=true;
      if(d.type==='gem'){gems++;addScore(200,d.x,d.y-30,true);sfx('gem');msg='+ GEM ('+gems+' THIS PLANET)';msgT=45;}
      if(d.type==='backpack'){backpackFuel=maxBackpackFuel;addScore(80,d.x,d.y-30,true);sfx('fuel');msg='+ BACKPACK FUEL';msgT=55;}
      if(d.type==='oxygen'){mineOxygen=Math.min(mineOxygenMax,mineOxygen+45);o2=mineOxygen;addScore(100,d.x,d.y-30,true);sfx('fuel');msg='+ OXYGEN';msgT=55;}
      if(d.type==='shipfuel'){mineShipFuel=Math.min(mineShipFuelRequired,mineShipFuel+1);addScore(300,d.x,d.y-30,true);sfx('fuel');msg='SHIP FUEL '+mineShipFuel+'/'+mineShipFuelRequired;msgT=70;if(mineShipFuel>=mineShipFuelRequired){backpackFuel=maxBackpackFuel;msg='ALL SHIP FUEL FOUND — JETPACK FULL';msgT=100;sfx('jingle');}}
    }
  }
  // A fall that reaches the bottom outside the defined holes is also a one-hull impact.
  if(ship.y>H+20 && !minePitHit && ship.inv===0){
    minePitHit=true;
    if(damage('FALLEN FROM PLANET SURFACE','FALL DAMAGE',false,true))return;
    ship.x=clamp(ship.x-70,80,surfaceWidth-80);
    ship.y=surfaceGroundY(ship.x)-32;
    ship.vy=0;ship.grounded=true;minePitHit=false;
  }
  const exit=drops.find(d=>d.type==='ship');
  if(Math.abs(exit.x-ship.x)<42&&ship.grounded){
    if(mineShipFuel>=mineShipFuelRequired){addScore(Math.round(mineOxygen)*10+mineShipFuel*300);completePlanet();return;}
    else if(msgT<=0&&stageTimer>60){msg='NEED '+(mineShipFuelRequired-mineShipFuel)+' MORE SHIP FUEL — FIND THE F CANISTERS';msgT=90;}
  }
}

function updateLavaFx(){

        if(Math.random()<.25&&audioCtx)beep(rnd(70,110),.06,'sine',.012,-30);}}
  }
  lavaFx=lavaFx.filter(f=>f.life>0);

function drawLavaPit(h){
  const x=h.x-cameraX, w=h.w, ly=h.lavaY, t=stageTimer, bot=ly+PIT_FLOOR+2;
  // Heat glow spilling out of the pit.
  const glow=ctx.createLinearGradient(0,ly-46,0,ly);
  glow.addColorStop(0,'rgba(255,90,20,0)');glow.addColorStop(1,'rgba(255,110,30,.28)');
  ctx.fillStyle=glow;ctx.fillRect(x-6,ly-46,w+12,46);
  ctx.save();
  ctx.beginPath();ctx.rect(x+1,ly-8,w-2,bot-ly+8);ctx.clip();
  // Molten pool.
  const surf=k=>ly+Math.sin(k*.16+t*.07+h.seed)*1.8+Math.sin(k*.05-t*.045)*1.4;
  const g=ctx.createLinearGradient(0,ly-3,0,bot);
  g.addColorStop(0,'#ffd23f');g.addColorStop(.25,'#ff8a1c');g.addColorStop(.7,'#d6340b');g.addColorStop(1,'#5a0c02');
  ctx.beginPath();ctx.moveTo(x,bot);
  for(let k=0;k<=w;k+=3) ctx.lineTo(x+k,surf(k));
  ctx.lineTo(x+w,bot);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  // Swirling currents: counter-rotating spiral arcs.
  const n=Math.max(2,Math.round(w/24));
  for(let i=0;i<n;i++){
    const cx=x+(i+.5)*w/n+Math.sin(t*.02+i*1.3+h.seed)*4, cy=ly+9+Math.cos(t*.025+i)*1.5;
    const dir=i%2?1:-1, a0=t*.05*dir+i*1.7+h.seed;
    for(let r=3;r<=10;r+=3.5){
      ctx.strokeStyle=r<5?'rgba(255,245,170,.85)':'rgba(255,200,80,.55)';ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(cx,cy,r,a0+r*.35,a0+r*.35+Math.PI*1.15);ctx.stroke();
    }
  }
  // Dark cooling crust drifting on the surface.
  ctx.fillStyle='rgba(70,10,0,.65)';
  for(let i=0;i<3;i++){const cx=x+((t*.25*(i%2?1:-1)+i*w/3+h.seed*20)%w+w)%w;ctx.beginPath();ctx.ellipse(cx,ly+2,5+i*2,1.6,0,0,Math.PI*2);ctx.fill();}
  // Bright shimmering surface line.
  ctx.strokeStyle='#fff1a8';ctx.lineWidth=2;ctx.globalAlpha=.75+Math.sin(t*.12+h.seed)*.2;
  ctx.beginPath();for(let k=0;k<=w;k+=3)k?ctx.lineTo(x+k,surf(k)):ctx.moveTo(x,surf(0));ctx.stroke();
  ctx.restore();
  // Rock banks lit orange from below.
  ctx.strokeStyle='rgba(255,120,40,.75)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,surfaceTerrainY(h.x));ctx.lineTo(x+PIT_BANK,surfaceGroundY(h.x+PIT_BANK));ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+w,surfaceTerrainY(h.x+w));ctx.lineTo(x+w-PIT_BANK,surfaceGroundY(h.x+w-PIT_BANK));ctx.stroke();
}

function upgradeLayout(){
  const bw=Math.min(380,W*.86),bx=(W-bw)/2,rh=Math.min(46,H*.064),rowGap=6,startY=H*.30;
  const rows=[
    {type:'refuel',label:'REFUEL TO FULL',cost:1},
    {type:'fuel',  label:'FUEL TANK +20',cost:2},
    {type:'hull',  label:'REPAIR HULL +1',cost:2},
    {type:'laser', label:'LASER +1',cost:2},
    {type:'thrust',label:'THRUST +',cost:2},
    {type:'shield',label:'3 SEC SHIELD (↓ KEY)',cost:2},
    {type:'hook',label:'GRAPPLING HOOK',cost:3},
    {type:'life',label:'EXTRA LIFE +1',cost:5}
  ].map((r,i)=>({...r,y:startY+i*(rh+rowGap)}));
  const launchY=startY+rows.length*(rh+rowGap)+8;
  return {bw,bx,rh,rows,launch:{x:bx,y:launchY,w:bw,h:rh}};
}
function canBuy(type){
  if(type==='refuel') return banked>=1 && ship.fuel<ship.maxFuel-1;
  if(type==='fuel') return banked>=2;
  if(type==='hull') return banked>=2 && ship.hull<ship.maxHull;
  if(type==='laser') return banked>=2 && ship.laser<4;
  if(type==='thrust') return banked>=2 && ship.thrust<2.4;
  if(type==='shield') return banked>=2 && shieldCharges<3;
  if(type==='hook') return banked>=3 && !ship.hook;
  if(type==='life') return banked>=5 && !lifeUpgradeBought;
  return false;
}
function buy(type){
  if(!canBuy(type)){sfx('buzz');return}
  if(type==='refuel'){banked-=1;ship.fuel=ship.maxFuel}
  if(type==='fuel'){banked-=2;ship.maxFuel+=20;ship.fuel+=20}
  if(type==='hull'){banked-=2;ship.hull=Math.min(3,ship.maxHull,ship.hull+1)}
  if(type==='laser'){banked-=2;ship.laser++}
  if(type==='thrust'){banked-=2;ship.thrust=Math.min(2.4,ship.thrust+.35)}
  if(type==='shield'){banked-=2;shieldCharges++}
  if(type==='hook'){banked-=3;ship.hook=true;msg='GRAPPLING HOOK FITTED';msgT=90;}
  if(type==='life'){banked-=5;lives++;lifeUpgradeBought=true;sfx('extra');msg='EXTRA LIFE!';msgT=90;}
  sfx('gem');
}

function drawShip(x,y,s=1,angle=0,thrusting=false,leftJet=false,rightJet=false,player=false){
  if(player && (hideShip||blinking())) return;
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(s,s);mono();
  ctx.lineWidth=2;
  // Player ship evolves from the original through combined thruster/laser tiers.
  // Keep the original drawing untouched at the starting levels.
  if(player && (ship.laser>1 || ship.thrust>1)){
    const tt=ship.thrust>=2.3?4:ship.thrust>=1.9?3:ship.thrust>=1.5?2:ship.thrust>1?1:0;
    const lt=ship.laser>=4?3:ship.laser===3?2:ship.laser===2?1:0;
    // Five distinct silhouettes inspired by classic top-down arcade spacecraft.
    ctx.beginPath();
    if(tt===0){
      // Slim triangular interceptor (laser-upgrade silhouette).
      ctx.moveTo(0,-24);ctx.lineTo(13,8);ctx.lineTo(21,24);ctx.lineTo(7,20);
      ctx.lineTo(-7,20);ctx.lineTo(-21,24);ctx.lineTo(-13,8);
    }else if(tt===1){
      // Narrow central fuselage with swept twin engine wings.
      ctx.moveTo(0,-22);ctx.lineTo(7,-12);ctx.lineTo(8,5);ctx.lineTo(18,18);
      ctx.lineTo(10,16);ctx.lineTo(5,12);ctx.lineTo(-5,12);ctx.lineTo(-10,16);
      ctx.lineTo(-18,18);ctx.lineTo(-8,5);ctx.lineTo(-7,-12);
    }else if(tt===2){
      // Broad, chunky freighter body with side pods.
      ctx.moveTo(0,-23);ctx.lineTo(8,-15);ctx.lineTo(13,-8);ctx.lineTo(22,-5);
      ctx.lineTo(22,8);ctx.lineTo(13,12);ctx.lineTo(10,20);ctx.lineTo(-10,20);
      ctx.lineTo(-13,12);ctx.lineTo(-22,8);ctx.lineTo(-22,-5);ctx.lineTo(-13,-8);ctx.lineTo(-8,-15);
    }else if(tt===3){
      // Falcon-like wide swept wings and central cockpit.
      ctx.moveTo(0,-24);ctx.lineTo(8,-12);ctx.lineTo(15,-10);ctx.lineTo(24,1);
      ctx.lineTo(18,3);ctx.lineTo(25,17);ctx.lineTo(9,13);ctx.lineTo(6,20);
      ctx.lineTo(-6,20);ctx.lineTo(-9,13);ctx.lineTo(-25,17);ctx.lineTo(-18,3);
      ctx.lineTo(-24,1);ctx.lineTo(-15,-10);ctx.lineTo(-8,-12);
    }else{
      // Heavy multi-engine gunship with broad armour and wing shoulders.
      ctx.moveTo(0,-25);ctx.lineTo(11,-15);ctx.lineTo(15,-8);ctx.lineTo(25,-2);
      ctx.lineTo(20,7);ctx.lineTo(25,18);ctx.lineTo(10,15);ctx.lineTo(7,22);
      ctx.lineTo(-7,22);ctx.lineTo(-10,15);ctx.lineTo(-25,18);ctx.lineTo(-20,7);
      ctx.lineTo(-25,-2);ctx.lineTo(-15,-8);ctx.lineTo(-11,-15);
    }
    ctx.closePath();ctx.stroke();
    // Cockpit and central hull details, scaled to suit the different silhouettes.
    ctx.strokeRect(-5,-4,10,20);
    line(0,-24,0,-30,1.5);
    if(tt>=2){ctx.strokeRect(-14,-4,5,11);ctx.strokeRect(9,-4,5,11);}
    if(tt>=3){line(-17,4,-22,11,1.5);line(17,4,22,11,1.5);}
    // Engine count is determined by thruster tier.
    const engines=tt===0?[0]:tt===1?[-4.5,4.5]:tt===2?[-7,0,7]:tt===3?[-10,0,10]:[-14,-5,5,14];
    ctx.lineWidth=1.8;
    for(const ex of engines)ctx.strokeRect(ex-2.2,tt>=3?19:tt>=2?17:15,4.4,5);
    // Laser level overlays the same hull: emitter pods, integrated guns, then longer barrels.
    if(lt>=1){
      ctx.strokeStyle='#ff3030';ctx.lineWidth=lt===1?1.8:lt===2?2.5:3;
      const len=lt===1?6:lt===2?11:16;
      line(-14,0,-14, len,lt===1?1.8:lt===2?2.5:3);
      line(14,0,14,len,lt===1?1.8:lt===2?2.5:3);
      if(lt>=2){line(-19,5,-19,5+len*.75,2);line(19,5,19,5+len*.75,2);}
      if(lt>=3){ctx.strokeRect(-21,-3,4,10);ctx.strokeRect(17,-3,4,10);}
    }else{
      // Tiny white hardpoints on the unarmed/first visual tier.
      if(tt>0){ctx.strokeStyle='#fff';line(-10,2,-13,6,1);line(10,2,13,6,1);}
    }
    if(thrusting){
      ctx.strokeStyle='#ffb347';ctx.lineWidth=1.7;
      for(const ex of engines){
        ctx.beginPath();ctx.moveTo(ex-1.5,tt>=3?24:tt>=2?22:20);
        ctx.lineTo(ex, (tt>=3?32:tt>=2?30:28)+rnd(2,5));
        ctx.lineTo(ex+1.5,tt>=3?24:tt>=2?22:20);ctx.stroke();
      }
    }
    ctx.restore();return;
  }
  ctx.beginPath();
  ctx.moveTo(0,-18);ctx.lineTo(11,-8);ctx.lineTo(13,6);ctx.lineTo(8,12);
  ctx.lineTo(-8,12);ctx.lineTo(-13,6);ctx.lineTo(-11,-8);ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.arc(0,-6,5,Math.PI,0);ctx.stroke();
  line(0,-18,0,-24,1.5);
  ctx.beginPath();ctx.arc(0,-25,1.5,0,Math.PI*2);ctx.stroke();
  line(-5,12,-3,17,2);line(5,12,3,17,2);line(-3,17,3,17,2);
  line(-8,10,-15,22,2);line(8,10,15,22,2);line(-15,22,-21,24,2);line(15,22,21,24,2);
  line(-10,13,-15,22,1);line(10,13,15,22,1);
  if(thrusting){
    ctx.strokeStyle='#ffb347';
    ctx.beginPath();ctx.moveTo(-3,18);ctx.lineTo(0,31+rnd(2,10));ctx.lineTo(3,18);ctx.stroke();
    ctx.globalAlpha=.45;
    ctx.beginPath();ctx.moveTo(-1.5,18);ctx.lineTo(0,39+rnd(0,7));ctx.lineTo(1.5,18);ctx.stroke();
    ctx.globalAlpha=1;mono();
  }
  if(leftJet){ctx.beginPath();ctx.moveTo(11,-4);ctx.lineTo(19,-1+rnd(-2,2));ctx.lineTo(12,3);ctx.stroke()}
  if(rightJet){ctx.beginPath();ctx.moveTo(-11,-4);ctx.lineTo(-19,-1+rnd(-2,2));ctx.lineTo(-12,3);ctx.stroke()}
  ctx.restore();
}

  ctx.globalAlpha=.45;ctx.beginPath();ctx.arc(-a.r*.2,-a.r*.1,a.r*.22,0,Math.PI*2);ctx.stroke();

  if(hitFlash){ctx.strokeStyle=hitFlash;ctx.fillStyle=hitFlash;}
  // Larger backpack sits on the astronaut's back and swaps sides with his facing direction.
  const packX=face>0?-16:8, packW=8;
  ctx.strokeRect(packX,-15,packW,15);
  ctx.strokeRect(packX+(face>0?2:1),-12,packW-2,8);

  const nozzleX=face>0?packX+packW-2:packX+2;
  ctx.beginPath();ctx.arc(0,-21,8,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#7fd8ff';ctx.fillRect(face>0?1:-6,-24,5,4);mono();if(hitFlash){ctx.strokeStyle=hitFlash;ctx.fillStyle=hitFlash;}
  const step=Math.abs(ship.vx)>.3&&ship.grounded?Math.sin(stageTimer*.3)*3:0;
  line(-6,3,-9+step,14);line(6,3,9-step,14);line(-7,-8,-13,-1);line(7,-8,13,-1);
  line(face*7,-6,face*17,-6,2);
  if(jetpackActive && keys.ArrowUp && backpackFuel>0 && !ship.grounded){
    const flicker=3+Math.sin(stageTimer*.8)*2;
    // A longer, tapered flame begins at the bottom nozzle of the backpack.
    ctx.strokeStyle='#35dfff';ctx.fillStyle='#35dfff';
    ctx.beginPath();
    ctx.moveTo(nozzleX-2,-1);
    ctx.lineTo(nozzleX-3,-1+flicker+9);
    ctx.lineTo(nozzleX,-1+flicker+31);
    ctx.lineTo(nozzleX+3,-1+flicker+10);
    ctx.lineTo(nozzleX+2,-1);
    ctx.closePath();ctx.fill();ctx.stroke();
    // Bright inner core gives the longer exhaust a clear, energetic centre.
    ctx.fillStyle='#fff4a8';ctx.strokeStyle='#fff4a8';
    ctx.beginPath();
    ctx.moveTo(nozzleX-1,-1);
    ctx.lineTo(nozzleX,-1+flicker+17);
    ctx.lineTo(nozzleX+1,-1);
    ctx.closePath();ctx.fill();
  }

}
function drawAlien(x,y,t,tough,damaged){

  if(tough&&!damaged){

    ctx.fillRect(-5,-12,2,2);ctx.fillRect(3,-12,2,2);
  } else if(!damaged){
    ctx.beginPath();ctx.arc(0,-12,9,Math.PI,0);ctx.lineTo(9,2);ctx.lineTo(-9,2);ctx.closePath();ctx.stroke();
    ctx.fillRect(-4,-12,2,2);ctx.fillRect(2,-12,2,2);

function drawCavern(){
  const p=planets[planetIndex];
  const baseY=H*.82,step=14,leftPts=[],rightPts=[];
  for(let sy=-40;sy<=H+40;sy+=step){

  }
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.moveTo(0,-40);leftPts.forEach(pt=>ctx.lineTo(pt[0],pt[1]));ctx.lineTo(0,H+40);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(W,-40);rightPts.forEach(pt=>ctx.lineTo(pt[0],pt[1]));ctx.lineTo(W,H+40);ctx.closePath();ctx.fill();
  ctx.strokeStyle=p.tint;ctx.lineWidth=2;
  ctx.beginPath();leftPts.forEach((pt,i)=>i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1]));ctx.stroke();
  ctx.beginPath();rightPts.forEach((pt,i)=>i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1]));ctx.stroke();

    else{ctx.moveTo(b.right,sy-sp.half);ctx.lineTo(b.right-L,sy);ctx.lineTo(b.right,sy+sp.half)}

    if(r.type==='life'&&lifeUpgradeBought) info='USED';
    if(r.type==='hook'&&ship.hook) info='FITTED';
    text(info,L.bx+L.bw-14,r.y+L.rh/2+6,13,'right');
    ctx.globalAlpha=1;
  });
  const l=L.launch;
  ctx.strokeStyle=ORE;ctx.lineWidth=3;ctx.strokeRect(l.x,l.y,l.w,l.h);ctx.fillStyle='rgba(255,211,107,.12)';ctx.fillRect(l.x,l.y,l.w,l.h);
  ctx.fillStyle=ORE;arc('LAUNCH > '+planets[planetIndex+1].name,W/2,l.y+l.h/2+7,16,'center',l.w-16);
  mono(.6);text('UP/DOWN SELECT • SPACE BUY • ENTER LAUNCH',W/2,l.y+l.h+24,11,'center');
  ctx.globalAlpha=.65;text(VERSION,W-18,H-18,12,'right');ctx.globalAlpha=1;
}

function drawTable(y,hl){
  ctx.fillStyle='#ff5050';arc('HIGH SCORES',W/2,y,12);
  table.forEach((r,i)=>{
    const yy=y+24+i*22;
    ctx.fillStyle=hl&&r.s===score&&r.s>0?ORE:'rgba(245,245,245,.9)';
    text((i+1)+'.  '+r.n+'   '+pad6(r.s),W/2,yy,15,'center');
  });
}

function drawTitle(){
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);mono();
  for(let i=0;i<80;i++){const x=(i*97)%W,y=(i*53)%H;ctx.globalAlpha=.15+(i%5)*.08;ctx.fillRect(x,y,1+(i%2),1+(i%2))}ctx.globalAlpha=1;
  shootingStars.forEach(st=>{ctx.globalAlpha=Math.min(1,st.life/10);mono();line(st.x,st.y,st.x-st.vx*4,st.y-st.vy*4,1.5)});
  ctx.globalAlpha=1;
  titleRocks.forEach(a=>drawRock(a,.35));
  // Attract-mode ship drifting across.
  drawShip((demoT*1.4)%(W+200)-100,H*.47+Math.sin(demoT*.03)*20,.9,Math.PI/2+Math.sin(demoT*.03)*.2,true);
  ctx.fillStyle='#ffffff';arc('SPACE',W/2,H*.17,46);
  ctx.fillStyle=ORE;arc('MINER 4000',W/2,H*.17+60,46);
  ctx.strokeStyle='#ff5050';line(W*.2,H*.17+80,W*.8,H*.17+80,3);
  mono();text('FLY • LAND • MINE • UPGRADE • ESCAPE',W/2,H*.17+108,W<520?10:15,'center');
  drawTable(H*.54,false);
  if((demoT>>5)%2===0){ctx.fillStyle='#ffffff';arc(matchMedia('(pointer:coarse)').matches?'TAP TO START':'PRESS ANY KEY',W/2,H*.5,16)}
  mono(.75);
  const s=W<520?10:13;
  text(W<520?'◀ ▶ ROTATE  ▲ THRUST/JUMP  ● FIRE':'ROTATE ◀ ▶   THRUST / JUMP ▲   FIRE SPACE / ●',W/2,H*.54+150,s,'center');
  text('EXTRA SHIP EVERY '+EXTRA_LIFE_EVERY+(W<520?'':'  •  C = CRT FILTER'),W/2,H*.54+172,s,'center');
  if(bestPlanet) text('FURTHEST PLANET '+bestPlanet+'/'+planets.length,W/2,H*.54+194,s,'center');
  ctx.fillStyle=ORE;arc('PRESS ENTER FOR MORE INFO',W/2,H*.54+218,W<520?10:13,'center',W*.94);
  ctx.globalAlpha=.6;text('© GUNPOWDER STUDIOS   '+VERSION,W/2,H-14,11,'center');ctx.globalAlpha=1;
}

function drawInfo(){
  ctx.fillStyle='rgba(0,0,0,.88)';ctx.fillRect(0,0,W,H);
  const pw=Math.min(W-24,760), ph=Math.min(H-24,Math.max(410,H*.84)), px=(W-pw)/2, py=(H-ph)/2;
  ctx.fillStyle='#080b10';ctx.fillRect(px,py,pw,ph);
  ctx.strokeStyle=ORE;ctx.lineWidth=2;ctx.strokeRect(px+2,py+2,pw-4,ph-4);
  ctx.fillStyle=ORE;arc('SPACE MINER 4000',W/2,py+38,W<520?18:25,'center',pw-28);
  ctx.fillStyle='#fff';arc('MISSION BRIEFING',W/2,py+66,W<520?10:13,'center',pw-28);
  const small=W<520, fs=small?12:16, lh=small?25:31, x=px+18;
  let y=py+100;
  const section=(head,lines)=>{
    ctx.fillStyle='#7fffe6';text(head,x,y,fs+1);y+=lh*.78;
    ctx.fillStyle='#eee';
    for(const lineText of lines){
      const maxChars=small?48:86;
      const words=lineText.split(' ');let line='';
      for(const word of words){
        if((line+' '+word).trim().length>maxChars){text('• '+line,x+4,y,fs);y+=lh;line=word;}
        else line=(line+' '+word).trim();
      }
      if(line){text('• '+line,x+4,y,fs);y+=lh;}
    }
    y+=small?5:8;
  };
  section('YOUR MISSION',[
    'Fly through asteroid fields, land on strange worlds, then explore on foot.',
    'Mine each planet for gems and ship-fuel canisters, then return to your ship.',
    'On the final world, escape the rising lava to complete your five-planet run.'
  ]);
  section('SURVIVE AND UPGRADE',[
    'Watch your hull and fuel in space; on foot, manage oxygen and jetpack fuel.',
    'Collect gems and spend them in the workshop on repairs and ship upgrades.',
    'Find oxygen and backpack-fuel pickups, and use your limited shield charges wisely.'
  ]);
  section('CONTROLS',[
    'LEFT / RIGHT ARROWS: rotate in space; move on foot.',
    'UP ARROW: thrust, lander thrust, jump and jetpack.',
    'SPACE: fire (or grappling hook in caverns). DOWN ARROW: shield. P: pause.',
    'C: toggle the retro CRT screen effect. ENTER: close this briefing.'
  ]);
  section('ARCADE EXTRAS',[
    'Earn a free extra ship every 25,000 points. Chase the high-score table!',
    'There are five planets, each with its own hazards and increasing challenge.',
    'Your high scores are saved in this browser on this device.'
  ]);
  ctx.fillStyle=ORE;arc('PRESS ENTER / ESC TO RETURN',W/2,py+ph-20,small?9:12,'center',pw-24);
}

function drawInitials(){
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=ORE;arc('NEW HIGH SCORE!',W/2,H*.22,24);
  mono();text(pad6(score),W/2,H*.3,26,'center');
  text('ENTER YOUR INITIALS',W/2,H*.4,16,'center');
  const sz=Math.min(46,W*.12);
  for(let i=0;i<3;i++){
    const x=W/2+(i-1)*sz*1.6;
    ctx.fillStyle=i===entry.i?ORE:'#fff';
    arc(LETTERS[entry.l[i]]===' '?'_':LETTERS[entry.l[i]],x,H*.55,sz);
    if(i===entry.i&&(stageTimer>>4)%2) ctx.fillRect(x-sz*.55,H*.55+12,sz*1.1,4);
  }
  mono(.7);text('▲ ▼ CHANGE LETTER   ▶ / ● NEXT   ◀ BACK',W/2,H*.7,W<520?11:14,'center');
}

function drawVictoryScene(){
  const ground=H*.72;
  // Huge rocket: roughly eight times the astronaut's height.
  const rx=W*.63, ry=ground-150, rs=Math.min(1.25,W/700);
  ctx.save();ctx.translate(rx,ry);
  ctx.strokeStyle='#ddd';ctx.fillStyle='#111';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,-125*rs);ctx.quadraticCurveTo(38*rs,-95*rs,38*rs,-45*rs);ctx.lineTo(38*rs,55*rs);ctx.lineTo(24*rs,85*rs);ctx.lineTo(-24*rs,85*rs);ctx.lineTo(-38*rs,55*rs);ctx.lineTo(-38*rs,-45*rs);ctx.quadraticCurveTo(-38*rs,-95*rs,0,-125*rs);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#9bc7ff';ctx.beginPath();ctx.arc(0,-55*rs,17*rs,0,Math.PI*2);ctx.stroke();ctx.fill();
  ctx.beginPath();ctx.moveTo(-38*rs,20*rs);ctx.lineTo(-62*rs,68*rs);ctx.lineTo(-36*rs,58*rs);ctx.stroke();
  ctx.beginPath();ctx.moveTo(38*rs,20*rs);ctx.lineTo(62*rs,68*rs);ctx.lineTo(36*rs,58*rs);ctx.stroke();
  ctx.fillStyle='#ff7a2f';ctx.beginPath();ctx.moveTo(-17*rs,85*rs);ctx.lineTo(17*rs,85*rs);ctx.lineTo(9*rs,112*rs);ctx.lineTo(-9*rs,112*rs);ctx.closePath();ctx.fill();
  ctx.restore();

  // Astronaut beside the rocket, with a waving arm.
  const ax=W*.30, ay=ground-30;
  drawAstronaut(ax,ay,1);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(ax+10,ay-25);ctx.lineTo(ax+28,ay-48);ctx.lineTo(ax+40,ay-63);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ax+40,ay-63);ctx.lineTo(ax+36,ay-76);ctx.moveTo(ax+40,ay-63);ctx.lineTo(ax+50,ay-72);ctx.stroke();

  // Small friendly robot beside the astronaut.
  const bx=ax+58, by=ground-22;
  ctx.strokeStyle='#7fffe6';ctx.fillStyle='#111';ctx.lineWidth=2;
  ctx.strokeRect(bx-13,by-27,26,24);ctx.strokeRect(bx-16,by-3,32,24);
  ctx.fillStyle='#ff69d8';ctx.fillRect(bx-7,by-19,4,4);ctx.fillRect(bx+3,by-19,4,4);
  ctx.beginPath();ctx.moveTo(bx,by-27);ctx.lineTo(bx,by-36);ctx.stroke();ctx.fillRect(bx-2,by-38,4,4);
  ctx.beginPath();ctx.moveTo(bx-16,by+3);ctx.lineTo(bx-27,by+10);ctx.moveTo(bx+16,by+3);ctx.lineTo(bx+27,by+10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bx-8,by+21);ctx.lineTo(bx-10,by+30);ctx.moveTo(bx+8,by+21);ctx.lineTo(bx+10,by+30);ctx.stroke();
}

function drawEnd(win){
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);
  if(win){
    // ZX Spectrum-style scrolling starfield: crisp monochrome pixels drifting diagonally.
    for(let i=0;i<180;i++){
      const speed=.35+(i%7)*.16;
      const x=((i*137.5+23-stageTimer*speed*.42)%W+W)%W;
      const y=(i*83.7+17+stageTimer*speed*1.35)%H;
      const bright=.25+((i*7)%10)/14;
      const size=i%13===0?2:1;
      ctx.globalAlpha=bright;
      ctx.fillStyle='#fff';ctx.fillRect(Math.round(x),Math.round(y),size,size);
      if(i%19===0){ctx.globalAlpha=bright*.45;ctx.fillRect(Math.round(x)-2,Math.round(y),5,1)}
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';
    arc('CONGRATS YOU MADE IT',W/2,H*.44,W<520?22:30,'center',W*.94);
    ctx.fillStyle=ORE;text('FINAL SCORE  '+pad6(score),W/2,H*.51,W<520?16:20,'center');
    if(canRestart()&&(stageTimer>>5)%2===0){
      ctx.fillStyle=ORE;
      arc('PRESS ANY KEY TO PLAY AGAIN',W/2,H*.59,W<520?10:14,'center',W*.94);
    } else {
      ctx.fillStyle=ORE;
      arc('PRESS ANY KEY TO PLAY AGAIN',W/2,H*.59,W<520?10:14,'center',W*.94);
    }
    return;
  }
  ctx.fillStyle='#ff5050';arc('GAME OVER',W/2,H*.2,34);
  mono(.8);text(deathReason,W/2,H*.27,14,'center');
  mono();text('SCORE '+pad6(score),W/2,H*.35,22,'center');
  text('REACHED PLANET '+(planetIndex+1)+' / '+planets.length+' — '+planets[Math.min(planetIndex,planets.length-1)].name,W/2,H*.4,13,'center');
  drawTable(H*.5,true);
  if(canRestart()&&(stageTimer>>5)%2===0){ctx.fillStyle='#fff';arc('PRESS ANY KEY',W/2,H*.85,14)}
}

function drawMessage(){
  if(msgT<=0||readyT>0)return;
  ctx.globalAlpha=Math.min(1,msgT/20);ctx.fillStyle='#000c';
  const mw=Math.min(W*.92,Math.max(W*.5,msg.length*9+40));
  ctx.fillRect((W-mw)/2,H*.2,mw,36);mono();text(msg,W/2,H*.2+25,W<520?12:14,'center');ctx.globalAlpha=1;
}
function drawReady(){
  if(readyT<=0)return;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H*.36,W,H*.22);
  if(readyA){ctx.fillStyle=ORE;arc(readyA,W/2,H*.43,26);}
  if(readyB){mono();text(readyB,W/2,H*.48,15,'center');}
  if((readyT>>3)%2){ctx.fillStyle='#ff5050';arc('READY!',W/2,readyA?H*.54:H*.48,18)}
}

/* ----------------------------------------------------------------- LOOP */
function update(){
  if(paused){ actionPressed=false; return; }
  if(state!=='upgrade')setWorkshopSound(false);
  else if(audioCtx && stageTimer%52===0)workshopHammer();
  if(pitFlashT>0)pitFlashT--;
  if(state==='flight'||(state==='exploding'&&explosionScene==='flight'))updateStars();
  if(readyT>0){readyT--;}
  else if(state==='flight')updateFlight();
  else if(state==='lander')updateLander();
  else if(state==='takeoff')updateTakeoff();
  else if(state==='surface')updateSurface();
  if(state==='exploding')updateExplosion();
  if(isMenu()){
    stageTimer++;demoT++;
    if(state==='win'&&stageTimer>=480){
      state='title';stageTimer=0;demoT=0;shootingStars=[];
    }
    if(state==='title'){
      if(Math.random()<.018 && shootingStars.length<3)
        shootingStars.push({x:rnd(W*.1,W*.75),y:rnd(20,H*.42),vx:rnd(8,13),vy:rnd(2.5,5),life:rnd(24,40)});
      shootingStars.forEach(st=>{st.x+=st.vx;st.y+=st.vy;st.life--});
      shootingStars=shootingStars.filter(st=>st.life>0&&st.x<W+80);
      if(!titleRocks.length) titleRocks=Array.from({length:7},()=>makeAsteroid(rnd(0,W),rnd(0,H)));
      titleRocks.forEach(a=>{a.x+=a.vx-.6;a.y+=a.vy*.5;a.rot+=a.spin;if(a.x<-40)a.x=W+40;if(a.y<-40)a.y=H+40;if(a.y>H+40)a.y=-40});
    }
  }
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.life--});
  particles=particles.filter(p=>p.life>0);
  popups.forEach(p=>{p.y-=.6;p.t--});popups=popups.filter(p=>p.t>0);
  if(ship.inv>0 && readyT<=0) ship.inv--;
  if(shieldT>0 && readyT<=0) shieldT--;
  if(msgT>0) msgT--;
  shake*=.85; if(shake<.3) shake=0;
  flash*=.85; if(flash<.02) flash=0;
  const flying=(state==='flight'||state==='lander'||state==='takeoff')&&readyT<=0;
  setThrustSound(flying && !!keys.ArrowUp && ship.fuel>0);
  if(flying && ship.fuel<20 && ship.fuel>0 && stageTimer%45===0) sfx('alarm');
  actionPressed=false;
  upPressed=false;
}
function postFX(){
  if(!crtOn) return;
  g1.clearRect(0,0,glow1.width,glow1.height);g1.drawImage(c,0,0,glow1.width,glow1.height);
  g2.clearRect(0,0,glow2.width,glow2.height);g2.drawImage(glow1,0,0,glow2.width,glow2.height);
  ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.55;ctx.drawImage(glow1,0,0,W,H);
  ctx.globalAlpha=.6;ctx.drawImage(glow2,0,0,W,H);
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake) ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  if(state==='title')drawTitle();
  else if(state==='info'){drawTitle();drawInfo();}
  else if(state==='flight')drawFlight();
  else if(state==='lander')drawLander();
  else if(state==='takeoff')drawTakeoff();
  else if(state==='surface')drawSurface();
  else if(state==='upgrade')drawUpgrade();
  else if(state==='exploding')drawExplosion();
  else if(state==='initials')drawInitials();
  else if(state==='gameover')drawEnd(false);
  else if(state==='win')drawEnd(true);
  if(!isMenu()){drawPopups();drawMessage();drawReady();}
  ctx.restore();
  if(flash){ctx.fillStyle='rgba(255,255,255,'+(flash*.3)+')';ctx.fillRect(0,0,W,H)}
  if(paused){ ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(0,0,W,H); ctx.fillStyle='#ffd36b';arc('PAUSED',W/2,H*.42,34); mono(); text('PRESS P TO CONTINUE',W/2,H*.50,16,'center'); }
  postFX();
}
const STEP=1000/60; let acc=0,last=performance.now();
function loop(t){
  acc+=Math.min(250,Math.max(0,t-last)); last=t;
  while(acc>=STEP){update();acc-=STEP;}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
